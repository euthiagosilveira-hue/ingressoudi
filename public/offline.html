<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Sem conexão | Ingressoudi</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050505; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { margin: 8px 0 0; font-size: 22px; }
    p { margin: 0; max-width: 320px; color: #a1a1aa; font-size: 15px; line-height: 1.5; }
    button { margin-top: 8px; border: 0; border-radius: 10px; background: #fbbf24; color: #09090b; font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; padding: 12px 22px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="Ingressoudi">
    <h1>Sem conexão</h1>
    <p>Verifique sua internet e tente de novo. Seus ingressos aparecem assim que a conexão voltar.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
